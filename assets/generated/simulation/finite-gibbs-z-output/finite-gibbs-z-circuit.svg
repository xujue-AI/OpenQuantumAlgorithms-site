<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">Fixed finite Gibbs Z-mean preparation: original primitive macro view</title>
  <desc id="description">Seven quantum wires. The system q0 is reset and prepared by H. Each of 64 rounds resets q1 through q6, applies the six-wire Gaussian access U with 140 primitives, a clock-controlled weak flag multiplexor with 32 primitives, and the full access inverse controlled on flag zero with 1321 primitives, then resets q1 through q6. q0 stays live throughout the rounds and is measured in Z at the end. Each reset round has 1505 primitive instances. The accepted R64 stream was emitted but not fully evolved; reduced channel powers and an actual R2 density evolution supplied the checks.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #25384a; }
      .wire { stroke: #687b8b; stroke-width: 1.6; }
      .gate { fill: #ffffff; stroke: #475d70; stroke-width: 1.5; }
      .reset { fill: #edf4f8; stroke: #648399; stroke-width: 1.3; }
      .macro { fill: #eef3ff; stroke: #536eae; stroke-width: 1.7; }
      .weak { fill: #eef8f3; stroke: #4f8b70; stroke-width: 1.7; }
      .label { font-size: 16px; }
      .small { font-size: 13px; fill: #506577; }
      .bold { font-size: 18px; font-weight: 650; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536eae" stroke-width="1.3"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="568" rx="16" fill="#fcfdff" stroke="#d4e0e8"/>
  <text x="32" y="34" class="bold">Fixed H = Z, β = 1 · known-plus input · R = 64</text>
  <text x="32" y="57" class="small">Original macro view derived from accepted QASM; every box expands to the full primitive stream.</text>
  <rect x="312" y="87" width="682" height="380" rx="12" fill="#f8faff" stroke="#9facc4" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="653" y="107" class="small" text-anchor="middle">One reset round: 6 resets + 1,493 dilation primitives + 6 resets = 1,505</text>

  <g class="wire">
    <path d="M177 134H1140"/><path d="M177 184H1042"/><path d="M177 234H1042"/>
    <path d="M177 284H1042"/><path d="M177 334H1042"/><path d="M177 384H1042"/>
    <path d="M177 434H1042"/>
  </g>
  <g class="label" text-anchor="end">
    <text x="160" y="139">q0 · system</text>
    <text x="160" y="189">q1 · clock bit 0</text><text x="160" y="239">q2 · clock bit 1</text>
    <text x="160" y="289">q3 · clock bit 2</text><text x="160" y="339">q4 · clock bit 3</text>
    <text x="160" y="389">q5 · proposal</text><text x="160" y="439">q6 · weak flag</text>
  </g>

  <rect x="198" y="115" width="43" height="38" rx="4" class="reset"/><text x="219.5" y="140" text-anchor="middle" class="label">|0⟩</text>
  <rect x="258" y="115" width="38" height="38" rx="4" class="gate"/><text x="277" y="140" text-anchor="middle" class="label">H</text>
  <text x="246" y="91" text-anchor="middle" class="small">prepare |+⟩</text>

  <g class="reset">
    <rect x="331" y="165" width="43" height="38" rx="4"/><rect x="331" y="215" width="43" height="38" rx="4"/>
    <rect x="331" y="265" width="43" height="38" rx="4"/><rect x="331" y="315" width="43" height="38" rx="4"/>
    <rect x="331" y="365" width="43" height="38" rx="4"/><rect x="331" y="415" width="43" height="38" rx="4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="352.5" y="190">|0⟩</text><text x="352.5" y="240">|0⟩</text><text x="352.5" y="290">|0⟩</text>
    <text x="352.5" y="340">|0⟩</text><text x="352.5" y="390">|0⟩</text><text x="352.5" y="440">|0⟩</text>
  </g>

  <rect x="404" y="116" width="139" height="286" rx="7" class="macro"/>
  <text x="473.5" y="231" text-anchor="middle" class="bold">Full U</text>
  <text x="473.5" y="258" text-anchor="middle" class="label">140 primitives</text>
  <text x="473.5" y="288" text-anchor="middle" class="small">Gaussian PREPARE</text>
  <text x="473.5" y="309" text-anchor="middle" class="small">signed evolution</text>
  <text x="473.5" y="330" text-anchor="middle" class="small">Pauli SELECT + DFT</text>

  <rect x="562" y="166" width="135" height="186" rx="7" class="weak"/>
  <text x="629.5" y="222" text-anchor="middle" class="label">16 clock words</text>
  <text x="629.5" y="251" text-anchor="middle" class="small">frequency-indexed</text>
  <text x="629.5" y="272" text-anchor="middle" class="small">rotation angles</text>
  <text x="629.5" y="301" text-anchor="middle" class="small">Gray–Walsh mux</text>
  <path d="M629 352V415" fill="none" stroke="#4f8b70" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="566" y="415" width="128" height="38" rx="5" class="weak"/>
  <text x="630" y="440" text-anchor="middle" class="label">weak RY mux</text>
  <text x="697" y="405" text-anchor="end" class="small">32 primitives total</text>

  <path d="M817 399V434" fill="none" stroke="#536eae" stroke-width="1.7"/>
  <rect x="742" y="116" width="149" height="286" rx="7" class="macro"/>
  <text x="816.5" y="231" text-anchor="middle" class="bold">Full U†</text>
  <text x="816.5" y="258" text-anchor="middle" class="label">on flag = 0</text>
  <text x="816.5" y="288" text-anchor="middle" class="label">1,321 primitives</text>
  <text x="816.5" y="318" text-anchor="middle" class="small">complete control lift</text>
  <text x="816.5" y="339" text-anchor="middle" class="small">all relative phases</text>
  <circle cx="817" cy="434" r="6.5" fill="#fcfdff" stroke="#536eae" stroke-width="1.7"/>
  <text x="817" y="457" text-anchor="middle" class="small">zero control</text>

  <g class="reset">
    <rect x="935" y="165" width="43" height="38" rx="4"/><rect x="935" y="215" width="43" height="38" rx="4"/>
    <rect x="935" y="265" width="43" height="38" rx="4"/><rect x="935" y="315" width="43" height="38" rx="4"/>
    <rect x="935" y="365" width="43" height="38" rx="4"/><rect x="935" y="415" width="43" height="38" rx="4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="956.5" y="190">|0⟩</text><text x="956.5" y="240">|0⟩</text><text x="956.5" y="290">|0⟩</text>
    <text x="956.5" y="340">|0⟩</text><text x="956.5" y="390">|0⟩</text><text x="956.5" y="440">|0⟩</text>
  </g>

  <rect x="1046" y="115" width="85" height="38" rx="5" class="gate"/><text x="1088.5" y="140" text-anchor="middle" class="label">Z readout</text>
  <text x="1088.5" y="179" text-anchor="middle" class="small">±1 outcome</text>
  <path d="M966 488H339" fill="none" stroke="#536eae" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="653" y="510" text-anchor="middle" class="label">Repeat complete reset round 64 times; q0 remains live</text>
  <text x="32" y="540" class="small">96,323 primitive instances including input/reset/readout · all 64 Kraus outcomes retained · no heralding or shots</text>
  <text x="32" y="559" class="small">R64 source authenticated; reduced 4 × 4 channel powers used. Actual R2 density evolution checks reset and composition.</text>
</svg>
