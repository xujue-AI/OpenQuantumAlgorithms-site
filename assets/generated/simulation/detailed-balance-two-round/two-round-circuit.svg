<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" role="img" aria-labelledby="title desc">
  <title id="title">Fixed two-round finite composition: original six-wire macro circuit</title>
  <desc id="desc">One round resets auxiliary wires q1 through q5, applies full access U on q0 through q2, rotates weak flag q3 under the clock, applies complete U inverse controlled only on q3 equal to zero, and discards all weak outcomes by resetting q1 through q3. Wires q4 and q5 remain reserved idle during weak access. A full six-wire correction LCU is followed by measurement of q1 through q5 into five-bit herald c_i and reset of those auxiliaries. System q0 is preserved throughout a continuing round. The complete source prepares known plus with system reset and H, reaches round two only after c1 equals zero, and reads Z only after c2 also equals zero. Either failure resets q0 and supplies no Z sample. The figure is a macro view of emitted primitive source, not a claim that the whole conditional trial was simulated; numerical checks evolved measurement-free stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17253b; }
      .wire { stroke: #334155; stroke-width: 2; fill: none; }
      .gate { fill: #ffffff; stroke: #334155; stroke-width: 1.8; }
      .access { fill: #eaf2ff; stroke: #346099; stroke-width: 1.8; }
      .correct { fill: #eaf6f1; stroke: #387663; stroke-width: 1.8; }
      .reset { fill: #fff6e8; stroke: #936532; stroke-width: 1.8; }
      .decision { fill: #f2edfc; stroke: #6b5291; stroke-width: 1.8; }
      .label { font-size: 15px; }
      .small { font-size: 13px; fill: #526078; }
      .tiny { font-size: 12px; fill: #526078; }
      .flow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1438" height="808" rx="16" fill="#fbfcfe" stroke="#cad4e1"/>
  <text x="40" y="43" font-size="24" font-weight="700">Fixed two-round finite composition</text>
  <text x="40" y="69" class="label">Original macro view of primitive source · one system spin · six reserved quantum wires</text>
  <rect x="26" y="88" width="1388" height="384" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="46" y="116" font-size="17" font-weight="700">One round i = 1 or 2</text>
  <text x="1300" y="116" class="small" text-anchor="end">Time →</text>

  <g class="wire">
    <path d="M160 160 H1300"/>
    <path d="M160 205 H1300"/>
    <path d="M160 250 H1300"/>
    <path d="M160 295 H1300"/>
    <path d="M160 340 H1300"/>
    <path d="M160 385 H1300"/>
  </g>
  <g class="label">
    <text x="47" y="165">q0 system</text>
    <text x="47" y="210">q1 clock low</text>
    <text x="47" y="255">q2 clock high</text>
    <text x="47" y="300">q3 flag / weight</text>
    <text x="47" y="345">q4 selector</text>
    <text x="47" y="390">q5 LCU</text>
  </g>
  <text x="211" y="143" class="small" text-anchor="middle">Aux reset</text>
  <g class="reset">
    <rect x="193" y="187" width="36" height="36" rx="4"/>
    <rect x="193" y="232" width="36" height="36" rx="4"/>
    <rect x="193" y="277" width="36" height="36" rx="4"/>
    <rect x="193" y="322" width="36" height="36" rx="4"/>
    <rect x="193" y="367" width="36" height="36" rx="4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="211" y="211">R</text>
    <text x="211" y="256">R</text>
    <text x="211" y="301">R</text>
    <text x="211" y="346">R</text>
    <text x="211" y="391">R</text>
  </g>

  <rect x="282" y="139" width="108" height="134" rx="7" class="access"/>
  <text x="336" y="191" font-size="22" font-weight="700" text-anchor="middle">U</text>
  <text x="336" y="216" class="small" text-anchor="middle">full Gaussian</text>
  <text x="336" y="237" class="small" text-anchor="middle">PREPARE/access</text>
  <rect x="420" y="187" width="120" height="126" rx="7" class="access"/>
  <text x="480" y="211" class="small" text-anchor="middle">l = q1 + 2 q2</text>
  <text x="480" y="244" class="small" text-anchor="middle">four-angle</text>
  <text x="480" y="266" class="small" text-anchor="middle">multiplexor</text>
  <text x="480" y="301" class="label" text-anchor="middle">RY(θ_l)</text>
  <text x="480" y="327" class="small" text-anchor="middle">θ_l = 2 asin √(δ η γ_l)</text>
  <text x="480" y="177" class="small" text-anchor="middle">all clock labels l = 0..3</text>

  <rect x="574" y="139" width="108" height="134" rx="7" class="access"/>
  <text x="628" y="191" font-size="22" font-weight="700" text-anchor="middle">U†</text>
  <text x="628" y="216" class="small" text-anchor="middle">complete inverse</text>
  <text x="628" y="237" class="small" text-anchor="middle">all source phases</text>
  <path d="M628 273 V288" class="wire"/>
  <circle cx="628" cy="295" r="7" fill="#ffffff" stroke="#346099" stroke-width="2"/>
  <text x="644" y="300" class="small">q3 = 0</text>

  <text x="751" y="143" class="small" text-anchor="middle">Discard/reset</text>
  <g class="reset">
    <rect x="733" y="187" width="36" height="36" rx="4"/>
    <rect x="733" y="232" width="36" height="36" rx="4"/>
    <rect x="733" y="277" width="36" height="36" rx="4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="751" y="211">R</text>
    <text x="751" y="256">R</text>
    <text x="751" y="301">R</text>
  </g>
  <path d="M244 340 H827 M244 385 H827" stroke="#ffffff" stroke-width="6" fill="none"/>
  <path d="M244 340 H827 M244 385 H827" stroke="#8b99af" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <text x="534" y="367" class="small" text-anchor="middle">q4 / q5 reserved idle during weak access</text>

  <rect x="837" y="139" width="155" height="267" rx="7" class="correct"/>
  <text x="914" y="229" font-size="19" font-weight="700" text-anchor="middle">Correction LCU</text>
  <text x="914" y="258" font-size="17" text-anchor="middle">blocks T, F_z</text>
  <text x="914" y="287" class="small" text-anchor="middle">all six wires</text>
  <text x="914" y="309" class="small" text-anchor="middle">frozen primitive source</text>

  <text x="1094" y="143" class="small" text-anchor="middle">Herald record</text>
  <g class="gate">
    <rect x="1046" y="187" width="96" height="36" rx="4"/>
    <rect x="1046" y="232" width="96" height="36" rx="4"/>
    <rect x="1046" y="277" width="96" height="36" rx="4"/>
    <rect x="1046" y="322" width="96" height="36" rx="4"/>
    <rect x="1046" y="367" width="96" height="36" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <text x="1094" y="211">M → c_i[0]</text>
    <text x="1094" y="256">M → c_i[1]</text>
    <text x="1094" y="301">M → c_i[2]</text>
    <text x="1094" y="346">M → c_i[3]</text>
    <text x="1094" y="391">M → c_i[4]</text>
  </g>
  <text x="1212" y="143" class="small" text-anchor="middle">Aux reset</text>
  <g class="reset">
    <rect x="1194" y="187" width="36" height="36" rx="4"/>
    <rect x="1194" y="232" width="36" height="36" rx="4"/>
    <rect x="1194" y="277" width="36" height="36" rx="4"/>
    <rect x="1194" y="322" width="36" height="36" rx="4"/>
    <rect x="1194" y="367" width="36" height="36" rx="4"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="1212" y="211">R</text>
    <text x="1212" y="256">R</text>
    <text x="1212" y="301">R</text>
    <text x="1212" y="346">R</text>
    <text x="1212" y="391">R</text>
  </g>
  <text x="1315" y="165" class="small">q0 held</text>
  <text x="194" y="441" class="small">R = reset to |0⟩</text>
  <text x="547" y="441" class="small" text-anchor="middle">All eight weak outcomes are discarded without postselection</text>
  <text x="1094" y="441" class="small" text-anchor="middle">c_i = 00000 is a successful herald</text>

  <text x="47" y="516" font-size="17" font-weight="700">Complete trial: classical branches after each herald</text>
  <rect x="67" y="550" width="183" height="78" rx="7" class="gate"/>
  <text x="158" y="582" class="label" font-weight="700" text-anchor="middle">Reset q0; H</text>
  <text x="158" y="607" class="small" text-anchor="middle">prepare known |+⟩</text>
  <path d="M250 589 H290" class="flow"/>
  <rect x="290" y="550" width="158" height="78" rx="7" class="correct"/>
  <text x="369" y="582" class="label" font-weight="700" text-anchor="middle">Round 1</text>
  <text x="369" y="607" class="small" text-anchor="middle">macro above, c1</text>
  <path d="M448 589 H479" class="flow"/>
  <path d="M522 550 L565 589 L522 628 L479 589 Z" class="decision"/>
  <text x="522" y="594" class="label" font-weight="700" text-anchor="middle">c1?</text>
  <path d="M565 589 H655" class="flow"/>
  <text x="610" y="574" class="small" text-anchor="middle">c1 = 0</text>
  <rect x="655" y="550" width="158" height="78" rx="7" class="correct"/>
  <text x="734" y="582" class="label" font-weight="700" text-anchor="middle">Round 2</text>
  <text x="734" y="607" class="small" text-anchor="middle">same q0, c2</text>
  <path d="M813 589 H844" class="flow"/>
  <path d="M887 550 L930 589 L887 628 L844 589 Z" class="decision"/>
  <text x="887" y="594" class="label" font-weight="700" text-anchor="middle">c2?</text>
  <path d="M930 589 H1010" class="flow"/>
  <text x="970" y="574" class="small" text-anchor="middle">c2 = 0</text>
  <rect x="1010" y="550" width="274" height="78" rx="7" class="access"/>
  <text x="1147" y="582" class="label" font-weight="700" text-anchor="middle">Z readout of q0</text>
  <text x="1147" y="607" class="small" text-anchor="middle">only after two successes; Z = ±1</text>
  <path d="M522 628 V690" class="flow"/>
  <path d="M887 628 V690" class="flow"/>
  <rect x="407" y="690" width="230" height="60" rx="7" class="reset"/>
  <text x="522" y="716" class="label" font-weight="700" text-anchor="middle">c1 ≠ 0: reset q0</text>
  <text x="522" y="737" class="small" text-anchor="middle">no Z sample; round 2 unreached</text>
  <rect x="772" y="690" width="230" height="60" rx="7" class="reset"/>
  <text x="887" y="716" class="label" font-weight="700" text-anchor="middle">c2 ≠ 0: reset q0</text>
  <text x="887" y="737" class="small" text-anchor="middle">no Z sample</text>
  <text x="47" y="785" class="small">A new attempt must restart the whole known input. Unreached c2 and failure-path Z bits are invalid.</text>
  <text x="1393" y="785" class="tiny" text-anchor="end">Source macro; staged checks only</text>
</svg>
