[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openquantum-algorithms"
version = "0.2.0"
description = "Executable quantum algorithms and explicit fault-tolerant resource models"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "qiskit>=2,<3",
  "numpy>=2,<3",
  "matplotlib>=3.9,<4",
  "pylatexenc>=2.10,<3",
  "qdk[qre]==1.34.0",
  "pandas>=2.1,<4",
  "scipy>=1.18,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyter-book==2.1.7", "ipywidgets==8.1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

