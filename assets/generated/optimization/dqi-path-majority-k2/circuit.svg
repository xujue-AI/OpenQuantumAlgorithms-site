<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
<title id="title">Fixed k=2 path-majority DQI: all 22 wires, grouped stages</title>
<desc id="desc">Original explanatory circuit schematic. Clause wires zero to nine; terminal syndrome ten; path internal syndromes eleven to fourteen and fifteen to eighteen; reused scratch nineteen to twenty-one. Twenty-two known-zero resets, preparation 955 primitives, sign three Z, incidence eighteen CX, two path decoders of 525 primitives, nine Hadamards and nine source readout mappings. Readout denotes unconditional probabilities, no actual shots. Detailed primitive gates remain in the saved QASM and NDJSON.</desc>
